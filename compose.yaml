services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: plastiflow
      POSTGRES_USER: plastiflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plastiflow -d plastiflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://database:5432/plastiflow
      DB_USERNAME: plastiflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CATALOG_MANAGER_PASSWORD: ${CATALOG_MANAGER_PASSWORD:?Set manager password}
      CATALOG_READER_PASSWORD: ${CATALOG_READER_PASSWORD:?Set reader password}
      PRODUCTION_PASSWORD: ${PRODUCTION_PASSWORD:?Set production password}
      QUALITY_PASSWORD: ${QUALITY_PASSWORD:?Set quality password}
      WORKFORCE_PASSWORD: ${WORKFORCE_PASSWORD:?Set workforce password}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set operator password}
      MAINTENANCE_PASSWORD: ${MAINTENANCE_PASSWORD:?Set maintenance password}
      TECHNICIAN_PASSWORD: ${TECHNICIAN_PASSWORD:?Set technician password}
      FACILITIES_PASSWORD: ${FACILITIES_PASSWORD:?Set facilities password}
      LOGISTICS_PASSWORD: ${LOGISTICS_PASSWORD:?Set logistics password}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD:?Set security password}
      GATE_PASSWORD: ${GATE_PASSWORD:?Set gate password}
      PAYROLL_PASSWORD: ${PAYROLL_PASSWORD:?Set payroll password}
      PAYROLL_APPROVER_PASSWORD: ${PAYROLL_APPROVER_PASSWORD:?Set payroll approver password}
      ACCOUNTANT_PASSWORD: ${ACCOUNTANT_PASSWORD:?Set ACCOUNTANT_PASSWORD in .env}
      FINANCE_PASSWORD: ${FINANCE_PASSWORD:?Set FINANCE_PASSWORD in .env}
      FINANCE_APPROVER_PASSWORD: ${FINANCE_APPROVER_PASSWORD:?Set FINANCE_APPROVER_PASSWORD in .env}
      INTEGRATION_PASSWORD: ${INTEGRATION_PASSWORD:?Set INTEGRATION password}
      REPORTS_PASSWORD: ${REPORTS_PASSWORD:?Set REPORTS password}
      DEVICE_PASSWORD: ${DEVICE_PASSWORD:?Set DEVICE password}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:?Set CUSTOMER password}
      CUSTOMER2_PASSWORD: ${CUSTOMER2_PASSWORD:?Set CUSTOMER2 password}
      SUPPLIER_PASSWORD: ${SUPPLIER_PASSWORD:?Set SUPPLIER password}
      PLASTIFLOW_AI_ENABLED: ${PLASTIFLOW_AI_ENABLED:-false}
      PLASTIFLOW_AI_MODEL: ${PLASTIFLOW_AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  database-data:
